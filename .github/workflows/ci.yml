name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: db_auditor_test
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d db_auditor_test"
          --health-interval 10s --health-timeout 5s --health-retries 12
      timescale:
        # Disposable TimescaleDB target for the full-collection test (#125).
        # Same digest QA used as latest-pg17.
        image: timescale/timescaledb:2.30.2-pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 12
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # go.mod says 1.27, and setup-go would install the newest patch.
          # Go 1.27.2 writes unified IR export version 5; staticcheck 2026.2.1
          # and golangci-lint 2.14.0 only read up to version 4. 1.27.1 is the
          # last patch those linters can analyze. Tests and the binary are unchanged.
          go-version: "1.27.1"
          cache-dependency-path: backend/go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          sqlc generate
          git diff --exit-code -- internal/database/sqlc
          go vet ./...

      - name: Install staticcheck
        working-directory: backend/tools/staticcheck
        run: go build -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck

      - name: staticcheck
        run: |
          "$RUNNER_TEMP/staticcheck" ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
          only-new-issues: true

      - name: Prove gosec fails a new finding
        working-directory: backend
        run: sh tools/lint-probe/expect-fail.sh

      - name: Prepare disposable snapshot store
        run: |
          for migration in migrations/01_baseline.sql migrations/03_audit_schedule.sql migrations/04_p1.sql migrations/05_p2.sql migrations/06_second_stage.sql migrations/07_third_stage.sql migrations/08_action_workload.sql migrations/09_query_action_metrics.sql migrations/10_account_activity.sql migrations/11_quality_validation.sql migrations/12_view_detail.sql migrations/13_index_detail.sql migrations/14_function_detail.sql migrations/15_cagg_source.sql migrations/16_identity.sql migrations/17_report_retention.sql migrations/18_totp_discard_retention.sql migrations/19_architecture_report.sql migrations/20_architecture_insertion.sql migrations/21_identity_login_block.sql migrations/22_finding_queue_order_idx.sql migrations/23_finding_env_last_seen_idx.sql migrations/24_report_limits_retention_governance.sql; do
            docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d db_auditor_test < "$migration" >/dev/null
          done

      - name: Test with coverage
        env:
          AUDITOR_MONGO_TEST_URI: mongodb://127.0.0.1:27017/db_auditor_ci?tls=false&directConnection=true
          AUDITOR_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55437/db_auditor_test?sslmode=disable
          AUDITOR_TEST_TIMESCALE_ADMIN_URL: postgresql://postgres@127.0.0.1:55438/postgres?sslmode=disable
          AUDITOR_TEST_DISPOSABLE: "1"
          AUDITOR_TEST_SCALE: "1"
        run: go test -p 1 ./... -coverprofile=coverage.out

      - name: Scale test report (duration and volume)
        timeout-minutes: 5
        env:
          AUDITOR_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55437/db_auditor_test?sslmode=disable
          AUDITOR_TEST_DISPOSABLE: "1"
          AUDITOR_TEST_SCALE: "1"
        run: |
          set -o pipefail
          start=$(date +%s)
          go test -p 1 -count=1 -v -timeout 3m -run '^TestSprint20LargeInventoryPagingIntegration$' ./internal/repository/ | tee scale-test.log
          elapsed=$(( $(date +%s) - start ))
          result=$(grep -o 'SCALE_RESULT.*' scale-test.log || true)
          if [ -z "$result" ]; then
            echo "::error::scale test did not report SCALE_RESULT (skipped or crashed)"
            exit 1
          fi
          echo "::notice title=Scale test::${result} wall=${elapsed}s"
          {
            echo "### Scale test (synthetic snapshot store)"
            echo
            echo '```'
            echo "${result} wall=${elapsed}s"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Query budget report (EXPLAIN + p95 vs calibration)
        timeout-minutes: 5
        env:
          AUDITOR_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55437/db_auditor_test?sslmode=disable
          AUDITOR_TEST_DISPOSABLE: "1"
          AUDITOR_TEST_SCALE: "1"
          AUDITOR_SCALE_PLAN_DIR: ${{ github.workspace }}/backend/scale-plans
        run: |
          set -o pipefail
          mkdir -p "$AUDITOR_SCALE_PLAN_DIR"
          go test -p 1 -count=1 -v -timeout 4m -run '^TestScaleQueryBudgetsIntegration$' ./internal/repository/ | tee query-budgets.log
          if ! grep -q 'SCALE_RESULT test=query_budgets' query-budgets.log; then
            echo "::error::query budget test did not report SCALE_RESULT (skipped or crashed)"
            exit 1
          fi
          {
            echo "### Query budgets (p95 vs same-database CPU calibration)"
            echo
            echo '```'
            grep -o 'SCALE_CALIBRATION.*' query-budgets.log || true
            grep -o 'SCALE_BUDGET.*' query-budgets.log
            grep -o 'SCALE_RESULT test=query_budgets.*' query-budgets.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload query plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-query-plans
          path: backend/scale-plans
          if-no-files-found: ignore
          retention-days: 14

      - name: Report under a container memory limit (PF-07)
        timeout-minutes: 8
        env:
          # 48 MiB, swap disabled. The worker test peaks around 15 MiB locally.
          REPORT_MEMORY_LIMIT_BYTES: "50331648"
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/reportworker.test" ./internal/reportworker/
          docker pull -q alpine:3.20 >/dev/null
          limit="$REPORT_MEMORY_LIMIT_BYTES"
          # Control: the same flags really kill a process that needs more memory.
          # awk is PID 1 and doubles a string up to 512 MiB (a peak of ~3x per
          # step), far beyond the limit, so the allocation is deterministic.
          # The kernel SIGKILLs it: exit 137. OOMKilled is also accepted, but
          # not required: dockerd can miss the OOM event when the container
          # exits first, which made this check flaky. "survived" means the
          # limit was not enforced.
          docker rm -f report-mem-control >/dev/null 2>&1 || true
          control_out=$(docker run --name report-mem-control --memory "$limit" --memory-swap "$limit" alpine:3.20 \
            awk 'BEGIN { s = "a"; while (length(s) < 536870912) s = s s; print "survived" }' 2>&1 || true)
          control_oom=$(docker inspect -f '{{.State.OOMKilled}}' report-mem-control)
          control_exit=$(docker inspect -f '{{.State.ExitCode}}' report-mem-control)
          docker rm report-mem-control >/dev/null
          control="oom_killed=${control_oom} exit=${control_exit}"
          echo "control container: ${control}"
          if printf '%s' "$control_out" | grep -q survived || { [ "$control_oom" != "true" ] && [ "$control_exit" != "137" ]; }; then
            echo "::error::control container was not killed by the memory limit (${control}); the limit is not enforced"
            exit 1
          fi
          set +e
          docker run --name report-mem --network host --memory "$limit" --memory-swap "$limit" \
            -e AUDITOR_TEST_DATABASE_URL="postgresql://postgres@127.0.0.1:55437/db_auditor_test?sslmode=disable" \
            -e AUDITOR_TEST_DISPOSABLE=1 -e AUDITOR_TEST_CONTAINER_MEMORY=1 -e AUDITOR_TEST_MEMORY_LIMIT_BYTES="$limit" \
            -v "$RUNNER_TEMP/reportworker.test:/reportworker.test:ro" alpine:3.20 \
            /reportworker.test -test.run '^TestLargeReportUnderContainerMemoryLimit$' -test.v -test.count=1 -test.timeout 5m 2>&1 | tee report-memory.log
          status=${PIPESTATUS[0]}
          set -e
          oom=$(docker inspect -f '{{.State.OOMKilled}}' report-mem)
          docker rm report-mem >/dev/null
          if [ "$oom" = "true" ]; then
            echo "::error::report worker test was OOM-killed under a ${limit}-byte container limit"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::report worker test failed inside the memory-limited container (exit $status)"
            exit 1
          fi
          result=$(grep -o 'CONTAINER_MEMORY_RESULT.*' report-memory.log || true)
          if [ -z "$result" ]; then
            echo "::error::container memory test did not report CONTAINER_MEMORY_RESULT (skipped?)"
            exit 1
          fi
          echo "::notice title=Report memory::${result}"
          {
            echo "### Report under a container memory limit"
            echo
            echo '```'
            echo "control ${control} ${result}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy filesystem (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  frontend:
    name: Frontend (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: OpenAPI client
        run: bun run gen:openapi && git diff --exit-code -- src/types/openapi.ts

      - name: Biome
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Trivy filesystem (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
