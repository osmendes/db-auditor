name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: db_auditor_test
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d db_auditor_test"
          --health-interval 10s --health-timeout 5s --health-retries 12
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # go.mod says 1.27, and setup-go would install the newest patch.
          # Go 1.27.2 writes unified IR export version 5; staticcheck 2026.2.1
          # and golangci-lint 2.14.0 only read up to version 4. 1.27.1 is the
          # last patch those linters can analyze. Tests and the binary are unchanged.
          go-version: "1.27.1"
          cache-dependency-path: backend/go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          sqlc generate
          git diff --exit-code -- internal/database/sqlc
          go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck
        run: staticcheck ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend

      - name: Prepare disposable snapshot store
        run: |
          for migration in migrations/01_baseline.sql migrations/03_audit_schedule.sql migrations/04_p1.sql migrations/05_p2.sql migrations/06_second_stage.sql migrations/07_third_stage.sql migrations/08_action_workload.sql migrations/09_query_action_metrics.sql migrations/10_account_activity.sql migrations/11_quality_validation.sql; do
            docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d db_auditor_test < "$migration" >/dev/null
          done

      - name: Test with coverage
        env:
          AUDITOR_MONGO_TEST_URI: mongodb://127.0.0.1:27017/db_auditor_ci?tls=false&directConnection=true
          AUDITOR_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55437/db_auditor_test?sslmode=disable
          AUDITOR_TEST_DISPOSABLE: "1"
        run: go test -p 1 ./... -coverprofile=coverage.out

      - name: Trivy filesystem (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  frontend:
    name: Frontend (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: OpenAPI client
        run: bun run gen:openapi && git diff --exit-code -- src/types/openapi.ts

      - name: Biome
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Trivy filesystem (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
