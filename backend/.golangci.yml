version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - gosec
    - unused
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: tools/lint-probe
        linters:
          - gosec
          - errcheck
          - staticcheck
          - unused
